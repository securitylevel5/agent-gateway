services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: agent_gateway
      POSTGRES_USER: agent_gateway_admin
      POSTGRES_PASSWORD: agent_gateway_dev
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_gateway_admin -d agent_gateway"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - agent-gateway-postgres:/var/lib/postgresql/data

  # Bridges OTLP gRPC from the (host-running) gateway to OTLP HTTP/JSON on
  # the (host-running) dashboard's /v1/traces endpoint.
  otel-collector:
    image: otel/opentelemetry-collector:0.111.0
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      - ./dashboard/otel-collector.yaml:/etc/otel-collector.yaml:ro
    ports:
      - "4317:4317"      # OTLP gRPC (gateway sends here)
    extra_hosts:
      # Lets the collector reach the dashboard running on the host.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  agent-gateway-postgres:
